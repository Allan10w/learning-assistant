# 同时管理前后端两个容器，定义了前端 (frontend) 和后端 (backend) 两个服务，并编排了它们的启动顺序、网络连接和端口映射。
version: '3' # 指定docker-compose版本
services:
  # 定义服务
  backend:
    # 后端服务
    build: ../backend
    container_name: learning-assistant-backend
    # 给启动后的容器起个固定的名字。这样你可以用 `docker stop learning-assistant-backend` 来管理它，而不是每次都要查随机生成的 ID。
    ports:
      - "8081:8080"
    # 端口映射: "宿主机端口:容器内端口"
    # 容器内部 Spring Boot 默认跑在 8080。
    # 我们把它映射到你电脑（宿主机）的 8081。这意味着你访问 localhost:8081 就能访问到这个服务。
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/tlias
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Cxl_0613
    # 环境变量，设置数据库连接信息
    restart: always
    # 重启策略，设置为 always，这样当容器意外退出时，Docker 会自动重启它。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 为容器添加 host.docker.internal 别名，这样后端代码中的 host.docker.internal 就能正确解析到宿主机的 IP 地址。


  frontend:
    # 前端服务
    build: ../frontend
    container_name: learning-assistant-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    # 依赖于 backend 服务，确保后端先启动
    restart: always
